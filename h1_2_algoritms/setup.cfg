[develop]
script_dir=$base/lib/h1_2_algoritms
[install]
install_scripts=$base/lib/h1_2_algoritms
[build_scripts]
# Shebang "/usr/bin/env python3" en vez de "/usr/bin/python3": así `ros2 run`
# usa el python3 activo (el del venv ~/venvs/h12, ver RECONSTRUIR.md) y no el
# del sistema, que no tiene las versiones correctas de numpy/scipy/osqp.
executable = /usr/bin/env python3
