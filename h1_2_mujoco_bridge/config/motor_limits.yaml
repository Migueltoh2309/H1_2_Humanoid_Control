# Límites por articulación. Los rangos de posición q_min/q_max se leen del
# MJCF (jnt_range); aquí solo pueden ESTRECHARSE, nunca ampliarse.
# Los actuadores <motor> del XML NO tienen ctrlrange/forcerange, por lo que
# tau_max DEBE venir de aquí. Valores aproximados a las especificaciones del
# H1-2 (ajustables); su función en simulación es acotar el control.
defaults:
  dq_max: 20.0          # [rad/s]
  tau_max: 80.0         # [N·m] (fallback)
  kp_max: 300.0
  kd_max: 20.0
  tau_rate_max: 1000.0  # [N·m/s]

joints:
  # ── Piernas ──────────────────────────────────────────────────────────
  left_hip_yaw_joint:      { tau_max: 220.0 }
  left_hip_pitch_joint:    { tau_max: 220.0 }
  left_hip_roll_joint:     { tau_max: 220.0 }
  left_knee_joint:         { tau_max: 360.0 }
  left_ankle_pitch_joint:  { tau_max: 75.0 }
  left_ankle_roll_joint:   { tau_max: 75.0 }
  right_hip_yaw_joint:     { tau_max: 220.0 }
  right_hip_pitch_joint:   { tau_max: 220.0 }
  right_hip_roll_joint:    { tau_max: 220.0 }
  right_knee_joint:        { tau_max: 360.0 }
  right_ankle_pitch_joint: { tau_max: 75.0 }
  right_ankle_roll_joint:  { tau_max: 75.0 }
  # ── Cintura ──────────────────────────────────────────────────────────
  torso_joint:             { tau_max: 220.0 }
  # ── Brazos (coherentes con controllers.yaml del bridge de brazos) ────
  left_shoulder_pitch_joint:  { tau_max: 38.0 }
  left_shoulder_roll_joint:   { tau_max: 38.0 }
  left_shoulder_yaw_joint:    { tau_max: 17.0 }
  left_elbow_joint:           { tau_max: 17.0 }
  right_shoulder_pitch_joint: { tau_max: 38.0 }
  right_shoulder_roll_joint:  { tau_max: 38.0 }
  right_shoulder_yaw_joint:   { tau_max: 17.0 }
  right_elbow_joint:          { tau_max: 17.0 }
  # ── Muñecas: kd_max reducido por estabilidad numérica ────────────────
  # Con armature=0.01 el límite seguro de Euler es kd·dt/M ≲ 1 → kd ≲ 10;
  # se deja margen (5.0). Si joint_armature=0.0, bajar kd_max a 0.3.
  left_wrist_roll_joint:   { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
  left_wrist_pitch_joint:  { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
  left_wrist_yaw_joint:    { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
  right_wrist_roll_joint:  { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
  right_wrist_pitch_joint: { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
  right_wrist_yaw_joint:   { tau_max: 18.0, kd_max: 5.0, kp_max: 120.0 }
